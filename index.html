<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Veille Cap Ferret</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Charte AIc, ambiance « écran d'accès » : anthracite en dégradé, cartes sombres, accents cuivre */
  --ink:#eef0f2; --ink-2:#a9afb5; --line:rgba(255,255,255,.10); --bg:#17191b; --panel:#212427; --panel-2:#2a2e32;
  --brand:#1c1f21; --accent:#e0a06a; --copper:#d6873f; --accent-soft:rgba(214,135,63,.16);
  --good:#7fd3a0; --good-soft:rgba(46,125,79,.28); --warn:#f0b866; --warn-soft:rgba(163,90,0,.30); --bad:#f2928a; --bad-soft:rgba(176,58,46,.30);
  --display:"Newsreader", Georgia, serif; --body:"Public Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  color-scheme:dark;
}

/* Version claire (ancienne charte), activée par le bouton Clair / Sombre */
:root[data-look="clair"]{
  --ink:#212529; --ink-2:#545c62; --line:#e2e4e6; --bg:#f4f5f6; --panel:#ffffff; --panel-2:#f4f5f6;
  --accent:#b8692a; --accent-soft:#f8ece0;
  --good:#2e7d4f; --good-soft:#e3f2e8; --warn:#9a5b12; --warn-soft:#fbefdc; --bad:#b03a2e; --bad-soft:#f8e2df;
  color-scheme:light;
}
[data-look="clair"] body{background:var(--bg)}
[data-look="clair"] header.top{background:#1c1f21;backdrop-filter:none}
[data-look="clair"] .tile,[data-look="clair"] .card,[data-look="clair"] .filters,[data-look="clair"] .tablewrap,[data-look="clair"] .bars{background:var(--panel)}
[data-look="clair"] .empty{background:var(--panel)}
[data-look="clair"] .filters select,[data-look="clair"] .filters input{background:var(--bg);border-color:var(--line)}
[data-look="clair"] .pill{background:#eceef0}
[data-look="clair"] .ph,[data-look="clair"] .mini{background:linear-gradient(135deg,var(--accent-soft),var(--line))}
[data-look="clair"] h2,[data-look="clair"] .price,[data-look="clair"] .tile b{color:var(--ink)}
[data-look="clair"] .btn{border-color:var(--line)}
[data-look="clair"] tr.us td{background:var(--accent-soft)}
.look{flex:none;font:600 12px var(--body);color:#c9cdd1;background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;cursor:pointer}
.look:hover{color:#fff;border-color:var(--copper)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(120% 70% at 15% 0%,#2b3034 0%,#1c1f21 45%,#141618 100%) fixed,var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
::selection{background:var(--copper);color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header.top{background:rgba(20,22,24,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);color:#fff;position:sticky;top:0;z-index:5}

.meta{color:var(--ink-2);font-size:13px}
.hd{display:flex;flex-direction:column;padding-top:16px}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:18px;text-decoration:none;min-width:0}
.brand img{height:44px;width:auto;display:block;flex:none}
.brand .sep{width:1px;height:38px;background:rgba(255,255,255,.18);flex:none}
.hd-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.hd-txt h1{margin:0;font:600 12px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--copper)}
.top .meta{color:#a9afb5;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{display:flex;gap:6px;margin-top:14px;border-top:1px solid rgba(255,255,255,.08)}
nav.tabs a{padding:12px 14px 11px;text-decoration:none;color:#c9cdd1;font-weight:600;font-size:14px;border-bottom:3px solid transparent}
nav.tabs a:hover{color:#fff}
nav.tabs a[aria-current="page"]{color:#fff;border-bottom-color:var(--copper)}
nav.tabs a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:28px 0 60px}
h2{font:500 23px/1.2 var(--display);color:#fff;margin:28px 0 4px;text-wrap:balance}
h2:first-child{margin-top:0}
.sub{color:var(--ink-2);margin:0 0 14px;max-width:70ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit}
.tile b{font:500 32px/1.1 var(--display);color:#fff}
.tile span{color:var(--ink-2);font-size:13px}
.tile.alert{border-left:4px solid var(--warn)}
.note{background:var(--accent-soft);border:1px solid rgba(214,135,63,.35);border-radius:14px;padding:12px 16px;margin:14px 0;max-width:80ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.nous{border-color:var(--copper);box-shadow:0 0 0 1px var(--copper) inset}
.card.nous .ag{background:var(--copper)}
.ph{position:relative;aspect-ratio:3/2;overflow:hidden;flex:none;background:linear-gradient(135deg,#2a2e32,#1c1f21);display:block}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:13px;text-align:center;padding:10px}
.ph .ag{position:absolute;left:8px;top:8px;background:rgba(28,31,33,.85);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px}
.ph .ev{position:absolute;right:8px;top:8px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.ev.nouveau{background:var(--copper);color:#fff}.ev.baisse{background:var(--good);color:#fff}.ev.hausse{background:var(--warn);color:#fff}.ev.retire{background:var(--bad);color:#fff}.ev.remis{background:var(--ink-2);color:#fff}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.price{font:600 21px/1.15 var(--display);color:#fff}
.price s{color:var(--ink-2);font:400 14px var(--body);margin-left:6px}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink-2);font-size:13px}
.ttl{font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--ink)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.cta{margin-top:auto;padding-top:6px;font-size:13px;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);font-weight:600}
.filters select,.filters input{font:14px var(--body);padding:8px 10px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:rgba(0,0,0,.25);color:var(--ink);min-width:140px}
.count{color:var(--ink-2);font-size:13px;margin:0 0 10px}
.tablewrap{overflow-x:auto;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right}
tr.us td{background:var(--accent-soft);font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.bar{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:14px;border-radius:4px;background:var(--copper)}
.bar em{font-style:normal;text-align:right;font-weight:600}
details.cmp{font-size:13px}
details.cmp p{margin:8px 0 2px}
.also{font-size:13px;color:var(--ink-2)}
.also a{font-weight:600}
.also b.neg{color:var(--bad)}
.spark{display:block}
details.cmp summary{cursor:pointer;color:var(--accent);font-weight:600}
details.cmp ul{margin:6px 0 0;padding-left:18px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.mini{position:relative;aspect-ratio:3/2;border-radius:8px;overflow:hidden;background:#2a2e32}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini span{position:absolute;left:4px;bottom:4px;background:rgba(28,31,33,.85);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px}
.simrow{border-top:1px solid var(--line);padding:6px 0;display:flex;flex-direction:column;gap:4px}
.empty{color:var(--ink-2);background:rgba(255,255,255,.03);border:1px dashed var(--line);border-radius:14px;padding:18px}
#lock{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 90% at 20% 10%,#2b3034 0%,#1c1f21 55%,#141618 100%)}
#lock[hidden]{display:none}
.lockwrap{width:100%;max-width:380px;display:flex;flex-direction:column;gap:28px}
.lockbrand{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lockbrand img{height:64px;width:auto}
.lockbrand p{margin:0;color:#fff;font:500 22px/1.25 var(--display);letter-spacing:.01em}
.lockbrand p span{display:block;margin-top:0;color:var(--copper);font:600 12px var(--body);letter-spacing:.18em;text-transform:uppercase}
.lockbox{display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:22px}
.lockbox label{font-size:12px;font-weight:600;color:#c9cdd1;letter-spacing:.06em;text-transform:uppercase}
.pw{display:flex;align-items:stretch;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(0,0,0,.25);overflow:hidden}
.pw:focus-within{border-color:var(--copper)}
.pw input{flex:1;min-width:0;font:16px var(--body);padding:13px 14px;border:0;background:transparent;color:#fff;outline:none}
.pw button{border:0;background:transparent;color:#c9cdd1;font:600 12px var(--body);padding:0 14px;cursor:pointer}
.lockbox .rem{display:flex;gap:9px;align-items:center;text-transform:none;letter-spacing:0;font-weight:400;font-size:14px}
.lockbox .rem input{accent-color:var(--copper);width:16px;height:16px}
.lockbox .go{font:600 15px var(--body);padding:13px;border:0;border-radius:10px;background:var(--copper);color:#fff;cursor:pointer;margin-top:4px}
.lockbox .go:hover{filter:brightness(1.07)}
.lockbox .err{color:#f0a39a;font-size:13px;min-height:1em;margin:0;text-align:center}
.stale{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.btn{font:600 13px var(--body);padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:transparent;color:var(--ink);cursor:pointer}
.dpes{display:flex;flex-direction:column;gap:8px}
.dpe{display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
[data-look="clair"] .dpe{background:var(--panel)}
.dpe-b{display:flex;flex-direction:column;gap:5px;min-width:0}
.dpe-b b{font-weight:600;overflow-wrap:anywhere}
.lab{flex:none;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 16px var(--body);color:#fff;background:#666}
.e-A{background:#009a52}.e-B{background:#52b153}.e-C{background:#a5cc74;color:#1c1f21}.e-D{background:#f4e70f;color:#1c1f21}.e-E{background:#f0b40f;color:#1c1f21}.e-F{background:#eb8235}.e-G{background:#d7221f}
.filters .chk{flex-direction:row;align-items:center;gap:8px;padding-bottom:8px}
.filters .chk input{min-width:0;width:16px;height:16px;accent-color:var(--copper)}
.agcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.agcard{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n chev" "s chev" "a chev";gap:2px 10px;align-items:center;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:44px}
[data-look="clair"] .agcard{background:var(--panel)}
.agcard:active{border-color:var(--copper)}
.agn{grid-area:n;font:600 17px var(--body)}
.agstock{grid-area:s;color:var(--ink-2);font-size:13px}.agstock b{color:var(--ink);font-weight:700}
.agact{grid-area:a;display:flex;gap:12px;font:700 14px var(--body);margin-top:4px}
.agact .up{color:var(--accent)}.agact .dn{color:var(--good)}.agact .rm{color:var(--bad)}
.chev{grid-area:chev;font-size:26px;color:var(--ink-2)}
.back{display:inline-block;padding:10px 0;font-weight:600;text-decoration:none}
details.big{margin-top:18px;font-size:14px}details.big>summary{padding:10px 0}
.feed{display:flex;flex-direction:column;gap:8px}
.fi{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:8px}
[data-look="clair"] .fi{background:var(--panel)}
.fimg{flex:none;width:72px;height:54px;border-radius:8px;overflow:hidden;background:#2a2e32;position:relative}
.fimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ftx{display:flex;flex-direction:column;gap:2px;min-width:0}
.ftx .ev{align-self:flex-start;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
.ftx b{font:600 16px var(--display)}.ftx s{color:var(--ink-2);font:400 12px var(--body)}
.ftx .meta{font-size:12px;color:var(--ink-2)}
@media (max-width:520px){.agcards{grid-template-columns:1fr}.tiles .tile b{font-size:22px}}
footer{color:var(--ink-2);font-size:12px;padding:20px 0 40px;border-top:1px solid var(--line)}
@media (max-width:520px){
  .hd{padding-top:12px}
  .brand{gap:12px}.brand img{height:34px}.brand .sep{height:30px}
  .hd-txt h1{font-size:10px;letter-spacing:.12em}
  .top .meta{font-size:11px}
  .look{padding:5px 10px;font-size:11px}
  .m-more{display:none}
  nav.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:10px;gap:0}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs a{white-space:nowrap;padding:11px 11px 10px;font-size:13px}
  main{padding-top:14px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:10px 12px}.tile b{font-size:24px}.tile span{font-size:12px;line-height:1.3}
  h2{font-size:19px;margin-top:22px}
  .sub{font-size:14px}
  .filters{gap:8px;padding:10px}.filters label{flex:1 1 140px}.filters select,.filters input{min-width:0;width:100%}
  .bar{grid-template-columns:90px 1fr 70px}
  /* Tableaux en cartes sur téléphone */
  .tablewrap{overflow:visible;background:transparent;border:0}
  .tablewrap table,.tablewrap tbody{display:block}
  .tablewrap thead{display:none}
  .tablewrap tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  [data-look="clair"] .tablewrap tr{background:var(--panel)}
  .tablewrap td{display:flex;flex-direction:column;gap:1px;padding:0;border:0;white-space:normal;text-align:left!important;font-size:14px}
  .tablewrap td::before{content:attr(data-label);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
  .tablewrap td:first-child{grid-column:1/-1;font:600 16px var(--body);color:var(--ink)}
  .tablewrap td:first-child::before{display:none}
  .tablewrap td:empty{display:none}
  .tablewrap td .pill{align-self:flex-start}
  .tablewrap tr.us{border-color:var(--copper)}
  .tablewrap tr.us td{background:transparent}
}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap hd">
    <div class="hd-row">
      <a class="brand" href="#semaine" aria-label="Accueil de la veille">
        <img src="https://www.agence-cap-ferret.fr/wp-content/uploads/2022/03/Fichier-3.svg" alt="L'Agence Immobilière du Cap" onerror="this.remove()">
        <span class="sep" aria-hidden="true"></span>
        <span class="hd-txt"><h1>Veille · Presqu'île du Cap Ferret</h1><span class="meta" id="meta">Chargement…</span></span>
      </a>
      <button class="look" id="look" type="button">Clair</button>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#semaine">Nouveautés</a>
      <a href="#vos-biens">Vos biens</a>
      <a href="#concurrents">Concurrents</a>
      <a href="#ventes">Prix vendus</a>
      <a href="#dpe">DPE récents</a>
      <a href="#tous">Tous les biens</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"><p class="sub">Chargement des données…</p></main>
<div id="lock" hidden>
  <div class="lockwrap">
    <div class="lockbrand">
      <img src="https://www.agence-cap-ferret.fr/wp-content/uploads/2022/03/Fichier-3.svg" alt="L'Agence Immobilière du Cap" onerror="this.remove()">
      <p><span>Presqu'île du Cap Ferret</span></p>
    </div>
    <form id="lock-f" class="lockbox" autocomplete="on">
      <label for="lock-p">Mot de passe</label>
      <div class="pw"><input id="lock-p" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required><button type="button" id="lock-eye" aria-label="Afficher le mot de passe">Afficher</button></div>
      <label class="rem"><input id="lock-r" type="checkbox" checked> Rester connecté sur cet appareil</label>
      <button type="submit" class="go">Entrer</button>
      <p id="lock-e" class="err" role="alert"></p>
    </form>
  </div>
</div>
<footer class="wrap" id="foot"></footer>

<script>
(function () { let v = null; try { v = localStorage.getItem("veille_look"); } catch (e) {} if (v === "clair") document.documentElement.dataset.look = "clair"; })();
const fmt = n => n == null ? "" : Math.round(n).toLocaleString("fr-FR");
const eur = n => n == null ? "Prix sur demande" : fmt(n) + " €";
const TYPES = {V:"Maison", VP:"Maison avec piscine", A:"Appartement", T:"Terrain"};
const cat = t => t === "A" ? "A" : t === "T" ? "T" : "M";
const pm2 = b => (b.prix && b.surface >= 15) ? b.prix / b.surface : null;
const median = a => { a = a.filter(x => x != null).sort((x, y) => x - y); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2; };
const q = (a, p) => { a = a.filter(x => x != null).sort((x, y) => x - y); if (!a.length) return null; const i = (a.length - 1) * p, lo = Math.floor(i); return a[lo] + (a[Math.ceil(i)] - a[lo]) * (i - lo); };
const dfr = d => new Date(d + "T12:00:00").toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//.test(u || "") ? u : "#";

let D, ACT, NOUS, CONC, BYID, MATCH, POSS, VERIF = {};

// Rapprochement multi-critères, tolérant aux erreurs de saisie (surface ou terrain approximatifs, chambres mal comptées).
// Chaque critère ajoute ou retire des points ; aucun ne suffit seul. Score max ≈ 105.
function matchScore(a, b) {
  if (cat(a.type) !== cat(b.type) || cat(a.type) === "T") return null;
  let s = 0; const why = [];

// DPE récents (base publique ADEME, licence ouverte), lus en direct à chaque ouverture.
let DPE = null, DPE_ERR = false, DPE_P = null;
function loadDPE() {
  if (DPE_P) return DPE_P;
  const d0 = new Date(Date.now() - 120 * 864e5).toISOString().slice(0, 10);
  const sel = "date_etablissement_dpe,type_batiment,surface_habitable_logement,etiquette_dpe,adresse_ban,annee_construction,_geopoint,numero_dpe";
  DPE_P = (async () => {
    let url = `https://data.ademe.fr/data-fair/api/v1/datasets/dpe03existant/lines?size=1000&qs=${encodeURIComponent(`code_insee_ban:33236 AND date_etablissement_dpe:>=${d0}`)}&sort=-date_etablissement_dpe&select=${sel}`, R = [];
    while (url && R.length < 3000) { const j = await (await fetch(url)).json(); R = R.concat(j.results || []); url = j.next || null; }
    DPE = R.filter(x => x.type_batiment === "maison" || x.type_batiment === "appartement").map(x => {
      const [lat, lon] = (x._geopoint || "0,0").split(",").map(Number);
      return {id: x.numero_dpe, d: x.date_etablissement_dpe, typ: x.type_batiment === "maison" ? "M" : "A", s: x.surface_habitable_logement, e: x.etiquette_dpe,
        adr: (x.adresse_ban || "").replace(/\s*339[57]0\s*Lège-Cap-Ferret\s*$/i, ""), an: x.annee_construction, sect: lat ? secteurDVF(lat, lon) : null};
    }).filter(x => x.sect !== "Lège");
  })().catch(() => { DPE_ERR = true; });
  return DPE_P;
}
function dpeEnVente(x) {
  if (!x.s) return [];
  return ACT.filter(b => cat(b.type) === x.typ && b.surface && Math.abs(b.surface - x.s) / x.s <= 0.08 && (!b.secteur || !x.sect || b.secteur === x.sect || b.secteur === "Presqu'île"));
}
function viewDPE() {

      const L = DPE.filter(x => x.d >= from && (!ty || x.typ === ty)).map(x => [x, dpeEnVente(x)]).filter(([x, v]) => !pi || !v.length);

      document.getElementById("fd-list").innerHTML = L.map(([x, v]) => `<div class="dpe">
        <span class="lab e-${esc(x.e)}" title="Étiquette énergie">${esc(x.e || "?")}</span>

          <span class="facts"><span>${dfr(x.d)}</span><span>${x.typ === "M" ? "Maison" : "Appartement"}</span>${x.s ? `<span>${fmt(x.s)} m²</span>` : ""}${x.an ? `<span>construit en ${x.an}</span>` : ""}${x.sect ? `<span>${esc(x.sect)}</span>` : ""}</span>
          <span class="pills">${v.length ? v.slice(0, 3).map(b => `<a class="pill acc" href="${esc(safeUrl(b.url))}" target="_blank" rel="noopener noreferrer">Peut-être en vente chez ${esc(b.nous ? "vous" : b.agence)} · ${eur(b.prix)}</a>`).join("") : `<span class="pill good">Piste : en vente nulle part</span>`}</span>
        </div></div>`).join("") || `<div class="empty">Aucun DPE sur la période.</div>`;
    };
    ["fd-per", "fd-type", "fd-piste"].forEach(i => document.getElementById(i).addEventListener("input", draw)); draw();

  const f30 = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10), D30 = DPE.filter(x => x.d >= f30);
  const pistes = D30.filter(x => !dpeEnVente(x).length).length;

}

const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
const norm = m => (m || "").trim().toLowerCase().replace(/\s+/g, "");
